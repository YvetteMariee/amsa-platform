# Alembic Configuration File

# La valeur de sqlalchemy.url sera lue depuis la variable d'environnement DATABASE_URL
# dans alembic/env.py
sqlalchemy.url = 

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic]
script_location = alembic
sqlalchemy.track_modifications = false
version_path_separator = :
version_locations =

migration_defaults =
    render_as_batch = true
