version: "3.9"

services:
  db:
    image: postgres:15
    container_name: amsa_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amsa}
      POSTGRES_DB: ${POSTGRES_DB:-amsa_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amsa_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amsa}:${POSTGRES_PASSWORD:-amsa}@db:5432/${POSTGRES_DB:-amsa_db}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amsa_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
